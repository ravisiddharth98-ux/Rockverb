
name: Rockverb Windows VST3 Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Rockverb
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure project
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target Rockverb_VST3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Rockverb-Windows-x64-VST3
          path: build/Rockverb_artefacts/Release/VST3/
          if-no-files-found: error
